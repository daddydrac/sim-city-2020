<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sim City 2020 · Architecture Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#c8d2ce;font:14px system-ui;color:#e3efe9}canvas{width:100vw;height:100vh;display:block;touch-action:none}aside{position:absolute;left:22px;top:22px;width:285px;max-height:calc(100vh - 44px);overflow:auto;padding:22px;background:#122b2be8;border:1px solid #ffffff25;border-radius:15px;box-shadow:0 12px 50px #14272535}h1{font-size:21px;letter-spacing:-.4px;margin:8px 0 22px}small{color:#88cfb0;text-transform:uppercase;letter-spacing:2px;font-size:10px}label{display:block;margin-top:16px;font-size:12px;color:#c2d4ce}select,input{width:100%;margin-top:7px;accent-color:#83dfb4}select,button{background:#23403f;color:#eef7f2;border:1px solid #819c8d55;border-radius:6px;padding:8px;font:inherit}button{cursor:pointer}button:hover{background:#36645a}.row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.row button{flex:1;font-size:11px;padding:7px}p{font-size:12px;line-height:1.6;color:#bdcec7}#stage{color:#fff;font-size:16px}#stats{font:11px monospace;line-height:1.7;color:#9fc2b3}a{color:#a5e4c6;text-decoration:none}output{float:right;color:white}#status{position:absolute;bottom:20px;right:22px;color:#182e27;background:#eaf2ecd9;padding:10px 16px;border-radius:8px;font-size:12px}#error{position:absolute;top:45%;left:35%;color:#182e27} @media(max-width:650px){aside{width:230px;left:10px;top:10px;padding:14px}#status{display:none}}
</style></head><body><canvas id="studio" aria-label="Interactive three-dimensional architecture preview"></canvas><aside><small>Sim City 2020 · v0.5.1</small><h1>Architecture Studio</h1><label>Building or infrastructure<select id="asset"></select></label><label>Development phase <output id="phase-label">6 / 10</output><input id="phase" type="range" min="1" max="10" value="6" step="1"></label><p id="stage"></p><p id="gate"></p><label>Time of day <output id="hour-label"></output><input id="hour" type="range" min="0" max="23.9" value="16" step=".1"></label><div class="row"><button id="cycle">Animate daylight</button><button id="evolve">Play evolution</button></div><label>Weather / season<select id="weather"><option value="sun">Clear summer</option><option value="rain">Rain · wet materials</option><option value="snow">Snow · roof accumulation</option><option value="autumn">Autumn foliage</option></select></label><label>Detail level<select id="lod"><option value="0">Close · facade geometry</option><option value="1">District · simplified detail</option><option value="2">Region · silhouettes</option></select></label><div class="row"><button data-view="iso">Isometric</button><button data-view="front">Front</button><button data-view="rear">Rear</button><button data-view="side">Side</button><button data-view="roof">Roof</button></div><div class="row"><button id="orbit">Auto orbit</button><button id="capture">Save PNG</button></div><p id="stats"></p><p>These are the same parametric models used in the game. Previewing a phase does not unlock it in your city. Drag to orbit; wheel to zoom.</p><a href="index.html">← Back to the game</a></aside><div id="status">Original architectural kit · no mirrored scene pass</div><p id="error" role="alert"></p><script type="module" src="gallery.mjs"></script></body></html>
